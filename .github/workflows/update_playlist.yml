name: Update Hotstar M3U Playlist

on:
  schedule:
    # Runs every 4 hours automatically
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub web UI

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Playlist Generator
        env:
          HOTSTAR_USER_TOKEN: ${{ secrets.HOTSTAR_USER_TOKEN }}
        run: |
          python generate_playlist.py

      - name: Commit and Push Playlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update playlist.m3u [skip ci]" && git push)
