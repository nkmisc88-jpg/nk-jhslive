name: Auto Update M3U Playlist

on:
  schedule:
    - cron: '0 */3 * * *' # Automatically runs every 3 hours
  workflow_dispatch:     # Allows running manually via the GitHub interface

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          if git diff --staged --quiet; then
            echo "No changes in playlist tokens."
          else
            git commit -m "Auto-refresh M3U stream tokens [skip ci]"
            git push
          fi
